],tags:["Tactical","PvP","Competitive","Team-based"],aliases:["ep","ember"],rating:4.4,reviewCount:48210,positivePercent:91,shortDescription:"Round-based 5v5 tactical shooter where every utility item has a cooldown, not a cost.",description:"Ember Protocol strips away the economy layer of traditional round-based shooters and replaces it with a cooldown system: every grenade, drone, and smoke charge regenerates over time instead of being bought. The result is a tighter, more readable mid-round \u2014 you always know roughly what your opponents have available. Five agents per side, twelve maps at launch, and a ranked ladder that recalculates matchmaking every 20 matches instead of every season.",features:["Online PvP","Ranked matchmaking","Controller support","Steam Cloud","Replay system","Anti-cheat enforced"],subgenres:["Tactical shooter"],modes:["5v5 PvP","Deathmatch","Custom lobbies"],perspective:"First-person",difficulty:"Skill-based",playtime:"Ongoing",controller:"Partial support",currentPrice:29.99,originalPrice:29.99,discountPercent:0,lowestPrice:22.49,lastUpdated:"2026-09-16T09:12:00",colorAccent:"#7C5CFF"}),Se({id:2,slug:"driftwood-hollow",title:"Driftwood Hollow",tagline:"Survive the tide. Rebuild the harbor.",developer:"Salt & Timber",publisher:"Salt & Timber",releaseDate:"2024-10-02",genres:["Survival","Simulation"],tags:["Survival","Crafting","Co-op","Open world"],aliases:["driftwood","hollow"],rating:4.1,reviewCount:9840,positivePercent:83,shortDescription:"Co-op survival about salvaging a flooded coastal town, one tide cycle at a time.",description:"Every twelve minutes the tide comes in and takes back whatever you haven't secured. Driftwood Hollow is built around that rhythm: scavenge the exposed seabed at low tide, then retreat to your rebuilt pier before the water \u2014 and what lives in it \u2014 returns. Up to four players can share a save, and structures persist between sessions on dedicated servers. There's no combat class system; what you carry into a run is what keeps you alive.",features:["Online co-op (4p)","Persistent world","Dedicated servers","Base building","Dynamic weather"],subgenres:["Survival crafting"],modes:["Co-op","Solo"],perspective:"First-person",playtime:"40+ hours",replayability:"High",currentPrice:19.99,originalPrice:24.99,discountPercent:20,saleEnd:"2026-09-22T23:59:00",lowestPrice:12.49,lastUpdated:"2026-09-16T09:12:00",priceHistory:[{d:"Jun",p:24.99},{d:"Jul",p:24.99},{d:"Aug",p:17.49},{d:"Sep",p:19.99}],colorAccent:"#3FA9A0"}),Se({id:3,slug:"iron-and-ash",title:"Iron & Ash",tagline:"A kingdom worth burning for.",developer:"Anvilheart Games",publisher:"Meridian Publishing",releaseDate:"2023-11-30",genres:["RPG","Strategy"],tags:["Dark fantasy","Story-rich","Turn-based","Choices matter"],aliases:["ia"],rating:4.7,reviewCount:61200,positivePercent:95,shortDescription:"A turn-based tactical RPG about holding a collapsing kingdom together with a company of exiles.",description:"Iron & Ash follows a disgraced captain assembling a company of exiles to defend a border kingdom nobody else will fight for. Combat is turn-based and terrain-driven \u2014 height, cover and morale matter more than raw stats. Outside of battle, your company's loyalty shifts based on the decisions you make at camp, and companions can leave permanently if you ignore them for too long. Three distinct endings depend on which factions still trust you by the final act.",features:["Single-player","Branching story","Turn-based tactics","Achievements","Steam Cloud","New Game+"],subgenres:["Tactical RPG"],modes:["Single-player"],perspective:"Isometric",playtime:"45\u201370 hours",replayability:"Very high",currentPrice:39.99,originalPrice:39.99,discountPercent:0,lowestPrice:27.99,lastUpdated:"2026-09-16T09:12:00",colorAccent:"#D9603B"}),Se({id:4,slug:"neon-veil",title:"Neon Veil",tagline:"Everyone in this city is lying. Find out why.",developer:"Static Bloom",publisher:"Nordlight Interactive",releaseDate:"2026-06-19",genres:["Adventure","Horror"],tags:["Cyberpunk","Detective","Narrative","Atmospheric"],aliases:[],rating:4.3,reviewCount:5310,positivePercent:89,shortDescription:"A neon-soaked investigation game where every witness statement contradicts the last.",description:"You play a licensed 'truth broker' in a city where memory can be edited for a price. Neon Veil is an investigation game without a fail state \u2014 you can't lose evidence, only misread it. Conversations branch based on what you've already learned, and the same crime scene reveals different details depending on which characters you've spoken to first. A single playthrough runs 8\u201310 hours; a second playthrough with a different questioning order surfaces a genuinely different culprit.",features:["Single-player","Branching dialogue","No combat","Controller support","Achievements"],subgenres:["Detective adventure"],modes:["Single-player"],perspective:"Third-person",playtime:"8\u201310 hours",replayability:"High",currentPrice:24.99,originalPrice:24.99,discountPercent:0,lowestPrice:24.99,lastUpdated:"2026-09-16T09:12:00",colorAccent:"#C13BE0"}),Se({id:5,slug:"hollow-orbit",title:"Hollow Orbit",tagline:"The station is stable. Everything else isn't.",developer:"Vantage Point",publisher:"Vantage Point",releaseDate:"2025-01-24",genres:["Horror","Survival"],tags:["Horror","Sci-fi","Atmospheric","Singleplayer"],aliases:["ho"],rating:4,reviewCount:14300,positivePercent:82,shortDescription:"Solo survival horror aboard a derelict station where oxygen is the real enemy.",description:"Hollow Orbit puts resource management ahead of jump scares. You're managing oxygen, power and hull integrity across a slowly decompressing station while something that isn't on the crew manifest moves through the ducts. There's a manual save system with limited save tokens, which is intentional \u2014 the tension comes from commitment, not checkpoints.",features:["Single-player","Manual saves","Atmospheric audio","Controller support"],subgenres:[
